<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Flint - C4ll</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    html, body { height: 100%; background: #0d0d12; color: #fdfdfd; overflow: hidden; }
    #topbar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: rgba(20,20,26,.9); border-bottom: 1px solid rgba(255,255,255,.06); }
    #topbar .brand { font-weight: 700; letter-spacing: -.01em; }
    #topbar .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }
    #topbar .room { color: #a1a1aa; font-size: .82rem; margin-left: auto; }
    #topbar button { background: rgba(255,255,255,.08); color: #fdfdfd; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 6px 12px; margin-left: 14px; font-size: .82rem; cursor: pointer; display: flex; align-items: center; gap: 7px; }
    #topbar button:hover { background: rgba(255,255,255,.16); }
    #stage { display: flex; height: calc(100% - 46px); }
    #callPane { position: relative; flex: 1; min-width: 0; }
    #chatPane { width: 360px; max-width: 42vw; border-left: 1px solid rgba(255,255,255,.08); background: #0d0d12; }
    #chatPane.hidden { display: none; }
    #chatPane iframe { width: 100%; height: 100%; border: 0; display: block; }
    #jitsi { width: 100%; height: 100%; }
    #jitsi iframe { border: 0; width: 100%; height: 100%; }
    .fallback { height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; }
    .fallback.show { display: flex; }
    .fallback i { font-size: 2.4rem; color: #e2c044; }
    .fallback p { color: #a1a1aa; max-width: 440px; }
    .fallback a { background: #e2c044; color: #141414; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 14px; }
    .loading { height: 100%; display: flex; align-items: center; justify-content: center; color: #a1a1aa; gap: 12px; }
    @media (max-width: 720px) { #chatPane { position: absolute; right: 0; top: 46px; bottom: 0; z-index: 20; } }
    .spinner { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.12); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="topbar">
    <span class="dot"></span>
    <span class="brand">C4ll</span>
    <span class="room">Global room · camera, mic &amp; screen share</span>
    <button id="toggleChat" data-testid="call-chat-toggle"><i class="fa-solid fa-comments"></i> Chat</button>
  </div>

  <div id="stage">
    <div id="callPane">
      <div class="loading" id="loading" data-testid="call-loading"><span class="spinner"></span> Connecting to the global call…</div>
      <div id="jitsi" data-testid="call-container" style="display:none"></div>
      <div class="fallback" id="fallback" data-testid="call-fallback">
        <i class="fa-solid fa-video-slash"></i>
        <p>Couldn't load the in-app call here. You can still join the same global room in a new tab.</p>
        <a id="fallbackLink" href="https://vc.autistici.org/FlintGlobalLoungeX7q2" target="_blank" rel="noopener">Open the call in a new tab</a>
      </div>
    </div>
    <div id="chatPane" data-testid="call-chat">
      <iframe src="ch4t.html" title="Global chat" allow="clipboard-write"></iframe>
    </div>
  </div>

  <script>
    const ROOM = "FlintGlobalLoungeX7q2"; // fixed room = one global call for everyone
    const $ = s => document.querySelector(s);

    // Route the call through the Flint proxy (Scramjet) when running inside the
    // proxy frame, so it works even when the calling site is blocked.
    function toProxied(url) {
      try {
        if (window.parent && window.parent !== window && window.parent.flintProxyEncode) {
          const p = window.parent.flintProxyEncode(url);
          if (p) return p;
        }
      } catch (e) {}
      return url;
    }

    function showFallback() {
      $('#loading').style.display = 'none';
      $('#jitsi').style.display = 'none';
      $('#fallback').classList.add('show');
    }

    function start() {
      const name = localStorage.getItem('ch4t_user') || ('guest-' + Math.floor(1000 + Math.random() * 9000));
      const hash = '#config.prejoinConfig.enabled=false'
                 + '&config.startWithAudioMuted=true'
                 + '&config.startWithVideoMuted=true'
                 + '&config.disableDeepLinking=true'
                 + '&userInfo.displayName=%22' + encodeURIComponent(name) + '%22';
      const roomUrl = 'https://vc.autistici.org/' + ROOM + hash;

      const iframe = document.createElement('iframe');
      iframe.src = toProxied(roomUrl);
      iframe.dataset.testid = 'call-iframe';
      iframe.allow = 'camera; microphone; display-capture; fullscreen; autoplay; clipboard-write; speaker-selection';
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.addEventListener('error', showFallback);

      $('#jitsi').appendChild(iframe);
      $('#loading').style.display = 'none';
      $('#jitsi').style.display = 'block';
    }

    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start);

    document.getElementById('toggleChat').addEventListener('click', () => {
      document.getElementById('chatPane').classList.toggle('hidden');
    });
  </script>
</body>

</html>

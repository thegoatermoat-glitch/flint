<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Flint - Ch4t</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #1a1a20;
      --bg-gradient-end: #0d0d12;
      --panel-bg: rgba(30, 30, 36, 0.6);
      --text: #fdfdfd;
      --text-soft: #a1a1aa;
      --accent: #e2c044;
      --border-light: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body::before { content:""; position:fixed; inset:0; background: radial-gradient(circle at top, var(--bg-gradient-start), var(--bg-gradient-end) 80%); z-index:-2; }
    body { height:100vh; display:flex; flex-direction:column; align-items:center; color:var(--text); background:var(--bg-gradient-end); overflow:hidden; }

    .wrap { width:100%; max-width:820px; height:100%; display:flex; flex-direction:column; padding:20px 16px; z-index:2; }

    header { display:flex; align-items:center; gap:14px; padding:6px 6px 14px; }
    header .title { font-size:1.8rem; font-weight:700; }
    header .status { display:flex; align-items:center; gap:7px; font-size:.82rem; color:var(--text-soft); }
    .dot { width:9px; height:9px; border-radius:50%; background:#f59e0b; box-shadow:0 0 8px #f59e0b; }
    .dot.on { background:#34d399; box-shadow:0 0 8px #34d399; }
    header .who { margin-left:auto; display:flex; align-items:center; gap:8px; }
    header .who input { background:var(--panel-bg); border:1px solid var(--border-light); color:var(--text); border-radius:12px; padding:8px 12px; outline:none; font-size:.85rem; width:130px; }
    header .who input:focus { border-color:var(--border-hover); }

    .messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:14px 6px; scroll-behavior:smooth; }
    .messages::-webkit-scrollbar { width:8px; } .messages::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:8px; }
    .msg { display:flex; flex-direction:column; gap:3px; max-width:78%; }
    .msg.me { align-self:flex-end; align-items:flex-end; }
    .msg .head { font-size:.75rem; color:var(--text-soft); display:flex; gap:8px; align-items:center; }
    .msg .name { font-weight:700; }
    .msg .bubble { background:var(--panel-bg); border:1px solid var(--border-light); padding:10px 14px; border-radius:16px; font-size:.95rem; line-height:1.4; word-break:break-word; backdrop-filter:blur(10px); }
    .msg.me .bubble { background:rgba(226,192,68,.14); border-color:rgba(226,192,68,.3); }
    .sys { align-self:center; font-size:.78rem; color:var(--text-soft); background:var(--panel-bg); padding:6px 14px; border-radius:20px; border:1px solid var(--border-light); }

    .composer { display:flex; gap:10px; padding:12px 6px 4px; }
    .composer input { flex:1; background:var(--panel-bg); border:1px solid var(--border-light); color:var(--text); border-radius:16px; padding:14px 18px; outline:none; font-size:1rem; backdrop-filter:blur(10px); }
    .composer input:focus { border-color:var(--border-hover); }
    .composer button { background:var(--accent); color:#141414; border:none; width:52px; border-radius:16px; font-size:1.1rem; cursor:pointer; transition:transform .15s; }
    .composer button:hover { transform:scale(1.05); }
    .composer button:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .hint { text-align:center; font-size:.72rem; color:var(--text-soft); padding-bottom:4px; }

    .gate { position:fixed; inset:0; z-index:200; background:rgba(9,9,13,.92); backdrop-filter:blur(14px); display:flex; align-items:center; justify-content:center; padding:20px; }
    .gate.hidden { display:none; }
    .gate-card { width:100%; max-width:400px; background:var(--panel-bg); border:1px solid var(--border-hover); border-radius:22px; padding:36px 30px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.6); }
    .gate-icon { font-size:2.2rem; color:var(--accent); margin-bottom:14px; }
    .gate-card h2 { font-size:1.5rem; margin-bottom:6px; }
    .gate-card p { color:var(--text-soft); font-size:.92rem; margin-bottom:22px; }
    .gate-card input { width:100%; background:rgba(0,0,0,.25); border:1px solid var(--border-light); color:var(--text); border-radius:14px; padding:14px 16px; outline:none; font-size:1rem; text-align:center; }
    .gate-card input:focus { border-color:var(--border-hover); }
    .gate-err { color:#fca5a5; font-size:.8rem; min-height:16px; margin:9px 0 2px; }
    .gate-card button { width:100%; background:var(--accent); color:#141414; border:none; border-radius:14px; padding:14px; font-weight:700; font-size:1rem; cursor:pointer; margin-top:6px; transition:transform .15s; }
    .gate-card button:hover { transform:translateY(-2px); }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <span class="title">Ch4t</span>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></span>
      <span class="who">
        <i class="fa-solid fa-user" style="color:var(--text-soft)"></i>
        <input id="nameInput" maxlength="18" data-testid="chat-name-input" title="Your display name">
      </span>
    </header>

    <div class="messages" id="messages" data-testid="chat-messages">
      <div class="sys">Anonymous global chat — everyone on every Flint site sees these messages.</div>
    </div>

    <form class="composer" id="composer">
      <input id="msgInput" placeholder="Type a message…" autocomplete="off" maxlength="500" data-testid="chat-input">
      <button type="submit" id="sendBtn" data-testid="chat-send"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
    <div class="hint">Messages are public and disappear after ~12 hours. Be nice 🙂</div>
  </div>

  <div class="gate" id="gate" data-testid="chat-gate">
    <div class="gate-card">
      <div class="gate-icon"><i class="fa-solid fa-comments"></i></div>
      <h2>Join the chat</h2>
      <p>Choose a username to enter the global chat.</p>
      <form id="gateForm">
        <input id="gateInput" maxlength="18" placeholder="Your username" autocomplete="off" data-testid="chat-username-input">
        <div class="gate-err" id="gateErr"></div>
        <button type="submit" data-testid="chat-join">Enter Chat</button>
      </form>
    </div>
  </div>

  <script>
    // ---- Global shared chat via ntfy.sh (keyless, works on every deployment) ----
    const TOPIC = "flint-ch4t-global-live-r5t8w"; // same topic everywhere = one global room
    const BASE = "https://ntfy.sh/" + TOPIC;
    const WS = "wss://ntfy.sh/" + TOPIC + "/ws";

    const $ = s => document.querySelector(s);
    const messagesEl = $('#messages');
    const seen = new Set();

    // ---- identity ----
    const COLORS = ["#e2c044","#7dd3fc","#fca5a5","#86efac","#c4b5fd","#fdba74","#f9a8d4","#67e8f9"];
    function getColor() {
      let c = localStorage.getItem("ch4t_color");
      if (!c) { c = COLORS[Math.floor(Math.random() * COLORS.length)]; localStorage.setItem("ch4t_color", c); }
      return c;
    }
    let me = { u: localStorage.getItem("ch4t_user") || null, c: getColor() };
    $('#nameInput').value = me.u || '';
    $('#nameInput').addEventListener('change', e => {
      const v = clean((e.target.value || '').trim()).slice(0, 18);
      if (v.length < 2) { e.target.value = me.u || ''; return; }
      me.u = v; e.target.value = v; localStorage.setItem("ch4t_user", v);
    });

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // ---- message filter (censor profanity) ----
    const BAD = ["fuck","fucking","fucker","motherfucker","shit","bullshit","bitch","asshole","ass","bastard","dick","dickhead","piss","cunt","nigger","nigga","faggot","fag","retard","retarded","slut","whore","cock","pussy","wanker","twat","douche","jerkoff"];
    const BAD_RE = new RegExp("\\b(" + BAD.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "gi");
    function clean(text) { return String(text || "").replace(BAD_RE, m => m[0] + "*".repeat(m.length - 1)); }

    function timeStr(t) { const d = new Date(t * 1000); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

    function addMessage(m, atTime) {
      // m: {u, t, c}
      if (!m || !m.t) return;
      const wrap = document.createElement('div');
      const mine = m.u === me.u;
      wrap.className = 'msg' + (mine ? ' me' : '');
      wrap.innerHTML = `
        <div class="head"><span class="name" style="color:${esc(m.c || '#e2c044')}">${esc(m.u || 'anon')}</span><span>${timeStr(atTime)}</span></div>
        <div class="bubble">${esc(clean(m.t))}</div>`;
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function handleNtfy(obj) {
      if (!obj || obj.event !== 'message') return;
      if (seen.has(obj.id)) return;
      seen.add(obj.id);
      let parsed;
      try { parsed = JSON.parse(obj.message); } catch { parsed = { u: 'anon', t: obj.message, c: '#a1a1aa' }; }
      addMessage(parsed, obj.time || Math.floor(Date.now() / 1000));
    }

    // ---- start the chat only after a username exists ----
    function startChat() {
      fetch(BASE + "/json?poll=1&since=12h")
        .then(r => r.text())
        .then(txt => {
          txt.split('\n').filter(Boolean).forEach(line => { try { handleNtfy(JSON.parse(line)); } catch {} });
        })
        .catch(() => {});
      connect();
    }

    // ---- realtime subscribe ----
    function setStatus(on) {
      $('#dot').classList.toggle('on', on);
      $('#statusText').textContent = on ? 'live' : 'reconnecting…';
    }
    let ws;
    function connect() {
      ws = new WebSocket(WS);
      ws.onopen = () => setStatus(true);
      ws.onmessage = ev => { try { handleNtfy(JSON.parse(ev.data)); } catch {} };
      ws.onclose = () => { setStatus(false); setTimeout(connect, 2500); };
      ws.onerror = () => { try { ws.close(); } catch {} };
    }

    // ---- username gate (must create a username before entering) ----
    const gate = $('#gate');
    function enterChat(name) {
      me.u = name;
      localStorage.setItem("ch4t_user", name);
      $('#nameInput').value = name;
      gate.classList.add('hidden');
      $('#msgInput').focus();
      startChat();
    }
    $('#gateForm').addEventListener('submit', e => {
      e.preventDefault();
      const v = clean($('#gateInput').value.trim()).slice(0, 18);
      if (v.length < 2) { $('#gateErr').textContent = 'Pick a username with at least 2 characters.'; return; }
      $('#gateErr').textContent = '';
      enterChat(v);
    });
    if (me.u) { gate.classList.add('hidden'); startChat(); }
    else { setTimeout(() => $('#gateInput').focus(), 120); }

    // ---- send ----
    $('#composer').addEventListener('submit', async e => {
      e.preventDefault();
      const inp = $('#msgInput');
      const text = clean(inp.value.trim());
      if (!text || !me.u) return;
      inp.value = '';
      const payload = JSON.stringify({ u: me.u, t: text, c: me.c });
      try {
        await fetch(BASE, { method: 'POST', body: payload });
      } catch {
        addMessage({ u: 'system', t: 'Failed to send — check your connection.', c: '#fca5a5' }, Math.floor(Date.now() / 1000));
      }
    });
  </script>
</body>
</html>

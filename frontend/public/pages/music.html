<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Flint - Mu51c</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #1a1a20;
      --bg-gradient-end: #0d0d12;
      --panel-bg: rgba(30, 30, 36, 0.6);
      --text: #fdfdfd;
      --text-soft: #a1a1aa;
      --accent: #e2c044;
      --border-light: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.15);
      --shadow-soft: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body::before { content:""; position:fixed; inset:0; background: radial-gradient(circle at top, var(--bg-gradient-start), var(--bg-gradient-end) 80%); z-index:-2; }
    body { min-height:100vh; display:flex; flex-direction:column; align-items:center; color:var(--text); background:var(--bg-gradient-end); padding-bottom:110px; }
    #particles { position:fixed; inset:0; z-index:-1; pointer-events:none; }
    .main-container { display:flex; flex-direction:column; align-items:center; width:100%; max-width:1100px; padding:56px 20px; z-index:10; }
    .title-section { display:flex; flex-direction:column; align-items:center; margin-bottom:1.8rem; gap:6px; }
    .title { font-size:3.2rem; font-weight:700; letter-spacing:-0.02em; }
    .subtitle { font-size:1.05rem; color:var(--text-soft); }
    .search-card { width:100%; max-width:540px; margin-bottom:2.5rem; border-radius:40px; background:var(--panel-bg); backdrop-filter:blur(16px); border:1px solid var(--border-light); box-shadow:var(--shadow-soft); transition:all .3s; }
    .search-card:focus-within { border-color:var(--border-hover); transform:translateY(-2px); }
    .search-box { display:flex; align-items:center; gap:12px; padding:10px 12px 10px 24px; }
    .search-box input { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:1.1rem; padding:6px 0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:26px 20px; width:100%; }
    .card { display:flex; flex-direction:column; gap:10px; cursor:pointer; }
    .art { width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:var(--panel-bg); border:1px solid var(--border-light); box-shadow:0 8px 22px rgba(0,0,0,.35); position:relative; transition:all .3s; }
    .card:hover .art { transform:translateY(-6px); border-color:var(--border-hover); box-shadow:0 14px 30px rgba(0,0,0,.5); }
    .art img { width:100%; height:100%; object-fit:cover; display:block; }
    .art .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(13,13,18,.4); opacity:0; transition:opacity .25s; font-size:2rem; color:#fff; }
    .card:hover .art .play, .card.playing .art .play { opacity:1; }
    .card.playing .art { border-color:var(--accent); }
    .t-name { font-size:.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .t-artist { font-size:.8rem; color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .state { color:var(--text-soft); margin-top:40px; }
    .player { position:fixed; left:50%; bottom:18px; width:min(680px, calc(100% - 32px)); background:rgba(20,20,26,.92); backdrop-filter:blur(18px); border:1px solid var(--border-hover); border-radius:20px; box-shadow:0 18px 50px rgba(0,0,0,.6); display:flex; align-items:center; gap:14px; padding:12px 18px; z-index:100; transform:translateX(-50%) translateY(140%); transition:transform .35s ease; }
    .player.show { transform:translateX(-50%) translateY(0); }
    .player img { width:52px; height:52px; border-radius:10px; object-fit:cover; }
    .player .meta { flex:1; min-width:0; }
    .player .p-name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player .p-artist { font-size:.82rem; color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player button { background:var(--accent); color:#141414; border:none; width:44px; height:44px; border-radius:50%; font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s; }
    .player button:hover { transform:scale(1.08); }
    .player .time { font-size:.72rem; color:var(--text-soft); min-width:34px; text-align:center; }
    .bar { position:absolute; left:0; bottom:0; height:3px; background:var(--accent); width:0%; border-radius:0 0 20px 20px; transition:width .2s linear; }
  </style>
</head>

<body>
  <canvas id="particles"></canvas>
  <div class="main-container">
    <div class="title-section">
      <h1 class="title">Mu51c</h1>
      <div class="subtitle">100 trending tracks + search anything — full songs</div>
    </div>
    <div class="search-card">
      <form class="search-box" id="searchForm" autocomplete="off">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search songs or artists..." autocomplete="off" data-testid="music-search-input">
      </form>
    </div>
    <div class="grid" id="trackList" data-testid="music-grid"></div>
    <div class="state" id="stateMsg">Loading trending tracks…</div>
  </div>

  <div class="player" id="player" data-testid="music-player">
    <img id="pArt" alt="">
    <div class="meta">
      <div class="p-name" id="pName">—</div>
      <div class="p-artist" id="pArtist"></div>
    </div>
    <span class="time" id="pTime">0:00</span>
    <button id="playPause" data-testid="music-playpause"><i class="fa-solid fa-pause"></i></button>
    <div class="bar" id="bar"></div>
  </div>
  <audio id="audio"></audio>

  <script>
    // ---- Audius: keyless, CORS, streams FULL tracks ----
    const $ = s => document.querySelector(s);
    const trackList = $('#trackList'), stateMsg = $('#stateMsg');
    const audio = $('#audio'), player = $('#player');
    let DEFAULT_SONGS = [];

    let HOST = "https://api.audius.co";
    const hostReady = (async () => {
      try { const j = await (await fetch("https://api.audius.co")).json(); if (j.data && j.data.length) HOST = j.data[0]; }
      catch {}
    })();
    const streamUrl = id => `${HOST}/v1/tracks/${id}/stream?app_name=Flint`;
    const mapTrack = t => {
      const a = t.artwork || {};
      return { id: t.id, title: t.title, artist: (t.user && t.user.name) || "Unknown", art: a["480x480"] || a["150x150"] || a["1000x1000"] || "" };
    };

    function fmt(s) { if (!s || isNaN(s)) return "0:00"; const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ":" + String(r).padStart(2, "0"); }

    async function play(track, cardEl) {
      document.querySelectorAll('.card.playing').forEach(c => c.classList.remove('playing'));
      if (cardEl) cardEl.classList.add('playing');
      await hostReady;
      audio.src = streamUrl(track.id);
      audio.play().catch(() => {});
      player.classList.add('show');
      $('#pArt').src = track.art;
      $('#pName').textContent = track.title;
      $('#pArtist').textContent = track.artist;
      $('#playPause').innerHTML = '<i class="fa-solid fa-pause"></i>';
    }

    $('#playPause').addEventListener('click', () => {
      if (audio.paused) { audio.play().catch(() => {}); $('#playPause').innerHTML = '<i class="fa-solid fa-pause"></i>'; }
      else { audio.pause(); $('#playPause').innerHTML = '<i class="fa-solid fa-play"></i>'; }
    });
    audio.addEventListener('timeupdate', () => {
      $('#bar').style.width = audio.duration ? (audio.currentTime / audio.duration * 100) + '%' : '0%';
      $('#pTime').textContent = fmt(audio.currentTime);
    });
    audio.addEventListener('ended', () => { $('#playPause').innerHTML = '<i class="fa-solid fa-play"></i>'; });

    function render(tracks) {
      trackList.innerHTML = '';
      if (!tracks.length) { stateMsg.textContent = 'No tracks found.'; stateMsg.style.display = 'block'; return; }
      stateMsg.style.display = 'none';
      tracks.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.testid = 'music-card';
        card.innerHTML = `
          <div class="art">
            <img loading="lazy" src="${t.art}" alt="" onerror="this.style.display='none'">
            <div class="play"><i class="fa-solid fa-play"></i></div>
          </div>
          <div class="t-name">${t.title}</div>
          <div class="t-artist">${t.artist}</div>`;
        card.addEventListener('click', () => play(t, card));
        trackList.appendChild(card);
      });
    }

    let timer;
    async function doSearch(q) {
      if (!q.trim()) { render(DEFAULT_SONGS); return; }
      stateMsg.textContent = 'Searching…'; stateMsg.style.display = 'block'; trackList.innerHTML = '';
      await hostReady;
      try {
        const j = await (await fetch(`${HOST}/v1/tracks/search?query=${encodeURIComponent(q)}&app_name=Flint&limit=40`)).json();
        render((j.data || []).map(mapTrack));
      } catch { stateMsg.textContent = 'Search failed, try again.'; stateMsg.style.display = 'block'; }
    }
    $('#searchForm').addEventListener('submit', e => { e.preventDefault(); clearTimeout(timer); doSearch($('#searchInput').value); });
    $('#searchInput').addEventListener('input', e => {
      clearTimeout(timer);
      if (!e.target.value.trim()) { render(DEFAULT_SONGS); return; }
      timer = setTimeout(() => doSearch(e.target.value), 450);
    });

    // default: 100 trending full tracks
    fetch('../data/songs.json')
      .then(r => r.json())
      .then(data => { DEFAULT_SONGS = data; if (!$('#searchInput').value.trim()) render(DEFAULT_SONGS); })
      .catch(() => { stateMsg.textContent = 'Search for a song or artist.'; });
  </script>

  <script>
    const canvas = document.getElementById("particles"), ctx = canvas.getContext("2d");
    function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; } resize(); onresize=resize;
    const ps=[]; class P{constructor(){this.r();}r(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.s=Math.random()*2+1;this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.4;this.a=.1+Math.random()*.2;}u(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height)this.r();}d(){ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,7);ctx.fillStyle=`rgba(255,255,255,${this.a})`;ctx.fill();}}
    for(let i=0;i<50;i++)ps.push(new P());
    (function a(){ctx.clearRect(0,0,canvas.width,canvas.height);ps.forEach(p=>{p.u();p.d();});requestAnimationFrame(a);})();
  </script>
</body>
</html>

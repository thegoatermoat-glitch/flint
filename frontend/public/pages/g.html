<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G4m3s</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #0d0d12; overflow: hidden; }
    #g4m3s-embed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <!-- G4m3s are served directly from fl1.dev (NOT through the pr0xy). -->
  <iframe
    id="g4m3s-embed"
    data-testid="g4m3s-embed"
    src="https://fl1.dev/"
    allow="fullscreen; autoplay; gamepad; clipboard-write; cross-origin-isolated"
    allowfullscreen="true"
    referrerpolicy="no-referrer">
  </iframe>
</body>
</html>
